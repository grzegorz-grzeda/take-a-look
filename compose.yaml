# take-a-look: production Compose project on the VPS.
# Guides: docs/guides/03-compose-and-caddy.md, docs/guides/04-meta-app-and-webhook.md
# HTTPS and routing live in the separate edge project (github.com/grzegorz-grzeda/edge):
# its Caddy reaches `webhook` over the shared external network `edge`.

name: take-a-look

services:
  # Throwaway prototype (spec 0001); replaced by the real service in issue 0004.
  # No `ports:` on purpose: reachable only through edge's Caddy on the `edge` network.
  webhook:
    build: ./prototype
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:-}
      META_PAGE_ACCESS_TOKEN: ${META_PAGE_ACCESS_TOKEN:-}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-}
    volumes:
      - webhook_data:/data     # payloads.jsonl: real, private data, never copied into the repo
    networks:
      - edge

volumes:
  webhook_data:

networks:
  edge:
    external: true  # created by the edge project; start it first
